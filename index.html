<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flip Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --tile-top: #1a1a1a;
    --tile-bottom: #0e0e0e;
    --numeral: #bdbdbd;
    --muted: #6b6b6b;
    --hinge: #000;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--numeral);
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4vh, 40px);
    padding: 16px 10px;
    min-height: 100%;
  }

  .clock {
    display: flex;
    gap: 2vw;
    align-items: center;
  }

  .group {
    display: flex;
    gap: 1vw;
  }

  .colon {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 12vw;
    color: var(--numeral);
    opacity: 0.8;
    line-height: 1;
  }

  .tile {
    position: relative;
    width: 22vw;
    height: 40vw;
    border-radius: 3.5vw;
    background: linear-gradient(var(--tile-top) 0%, var(--tile-top) 50%, var(--tile-bottom) 50%, var(--tile-bottom) 100%);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.03);
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  /* Centre hinge line */
  .tile::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 2px;
    background: var(--hinge);
    transform: translateY(-1px);
    z-index: 2;
  }

  .digit {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 36vw;
    line-height: 1;
    color: var(--numeral);
    font-variant-numeric: tabular-nums;
    transform: translateY(2%);
  }

  .tile.flip .digit {
    animation: flip 0.45s ease-out;
  }

  @keyframes flip {
    0%   { transform: perspective(400px) rotateX(-90deg); opacity: 0.2; }
    100% { transform: perspective(400px) rotateX(0deg); opacity: 1; }
  }

  .ampm {
    position: absolute;
    top: 6px;
    left: 5px;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 3.4vw;
    color: var(--numeral);
    z-index: 3;
    letter-spacing: 0.02em;
  }

  .info {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .day {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 6vw;
    color: var(--numeral);
  }

  .date {
    font-size: 4.2vw;
    color: var(--muted);
  }

  @media (min-width: 600px) {
    body { padding: 24px; }
    .clock { gap: clamp(8px, 2vw, 18px); }
    .group { gap: clamp(4px, 1vw, 10px); }
    .colon { font-size: clamp(40px, 9vw, 96px); }
    .tile { width: clamp(64px, 14vw, 150px); height: clamp(96px, 21vw, 220px); border-radius: clamp(8px, 1.6vw, 16px); }
    .digit { font-size: clamp(90px, 20vw, 210px); }
    .ampm { top: clamp(10px, 2vw, 18px); left: clamp(10px, 2vw, 18px); font-size: clamp(14px, 2.4vw, 22px); }
    .day { font-size: clamp(22px, 4vw, 34px); }
    .date { font-size: clamp(15px, 2.4vw, 19px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile.flip .digit { animation: none; }
  }
</style>
</head>
<body>

  <div class="clock" role="timer" aria-live="off" aria-label="Current time">
    <div class="group" id="hours"></div>
    <div class="colon" aria-hidden="true">:</div>
    <div class="group" id="minutes"></div>
  </div>

  <div class="info">
    <div class="day" id="day"></div>
    <div class="date" id="date"></div>
  </div>

<script>
  const groups = {
    hours: document.getElementById("hours"),
    minutes: document.getElementById("minutes"),
  };
  const dayEl = document.getElementById("day");
  const dateEl = document.getElementById("date");

  // Build tiles once; update digits on each tick.
  function buildTiles(name, count) {
    const frag = [];
    for (let i = 0; i < count; i++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      const digit = document.createElement("span");
      digit.className = "digit";
      digit.textContent = "0";
      tile.appendChild(digit);
      if (name === "hours" && i === 0) {
        const ap = document.createElement("span");
        ap.className = "ampm";
        ap.id = "ampm";
        tile.appendChild(ap);
      }
      frag.push(tile);
    }
    groups[name].replaceChildren(...frag);
  }
  buildTiles("hours", 2);
  buildTiles("minutes", 2);

  function setTile(tile, value) {
    const digit = tile.querySelector(".digit");
    if (digit.textContent !== value) {
      digit.textContent = value;
      tile.classList.remove("flip");
      void tile.offsetWidth; // restart animation
      tile.classList.add("flip");
    }
  }

  function pad(n) { return String(n).padStart(2, "0"); }

  function update() {
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes();

    const suffix = h >= 12 ? "PM" : "AM";
    h = h % 12;
    if (h === 0) h = 12;

    const hourTiles = groups.hours.querySelectorAll(".tile");
    const minTiles = groups.minutes.querySelectorAll(".tile");

    const hStr = pad(h);
    setTile(hourTiles[0], hStr[0]);
    setTile(hourTiles[1], hStr[1]);
    setTile(minTiles[0], pad(m)[0]);
    setTile(minTiles[1], pad(m)[1]);

    const ampm = document.getElementById("ampm");
    if (ampm) ampm.textContent = suffix;

    dayEl.textContent = now.toLocaleDateString(undefined, { weekday: "long" });
    dateEl.textContent = now.toLocaleDateString(undefined, {
      day: "numeric", month: "long", year: "numeric",
    });
  }

  update();
  setInterval(update, 250);
</script>
</body>
</html>
